{% extends 'base-dashboard-new.html' %}

{% load crispy_forms_tags %}
{% load widget_tweaks %}
{% block content %}

<div class="main_content_iner overly_inner ">
  <div class="container-fluid p-0 ">

    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <div class="alert alert-success" role="alert">
        {{ message }}
      </div>
      {% endfor %}
    </ul>
    {% endif %}
  </div>

  <div class="container form-wrapper" style="color: black">
    <div class="row edit-account-form-wrapper">
      <div class="">
        <div class="text-center">
            <h2>Update Account</h2>
          </div>
      </div>
    </div>

    
  </div>
</div>


{% endblock content %}
