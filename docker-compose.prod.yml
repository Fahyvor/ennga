services:
  # -------------------------------------------------------------
  # Production Django Web Application
  # -------------------------------------------------------------
  ennga:
    container_name: ennga-web-prod
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn ennga.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --no-control-socket --access-logfile - --error-logfile -
    restart: always
    volumes:
      - static_volume:/home/app/ennga/static
      - media_volume:/home/app/ennga/media
    expose:
      - "8000"
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  # -------------------------------------------------------------
  # Production Celery Worker & Beat Scheduler
  # -------------------------------------------------------------
  celery:
    container_name: ennga-celery-prod
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A ennga worker --loglevel=warning -B --concurrency=4
    restart: always
    volumes:
      - media_volume:/home/app/ennga/media
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
      - SKIP_MIGRATIONS=true
    depends_on:
      ennga:
        condition: service_started
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # Production PostgreSQL Database
  # -------------------------------------------------------------
  db:
    container_name: ennga-postgres-prod
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ennga_db}
      - POSTGRES_USER=${POSTGRES_USER:-ennga_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ennga_password}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ennga_user} -d ${POSTGRES_DB:-ennga_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Production Redis Cache & Broker
  # -------------------------------------------------------------
  redis:
    container_name: ennga-redis-prod
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Production Nginx Gateway
  # -------------------------------------------------------------
  nginx:
    container_name: ennga-nginx-prod
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    volumes:
      - static_volume:/home/app/ennga/static:ro
      - media_volume:/home/app/ennga/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      ennga:
        condition: service_started

  # -------------------------------------------------------------
  # Production Elasticsearch
  # -------------------------------------------------------------
  elasticsearch:
    container_name: ennga-elasticsearch-prod
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    restart: always
    environment:
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - cluster.name=elasticsearch
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  elasticsearch_data:
